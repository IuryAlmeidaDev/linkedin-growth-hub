name: LinkedIn AutoPost Diário

# Cron desativado para evitar publicações concorrentes (o agendamento ativo agora é de 2 em 2 dias localmente)
# on:
#   schedule:
#     - cron: '30 11 * * *'
on:
  workflow_dispatch: # Permite disparar manualmente a qualquer momento pelo GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Para salvar o histórico atualizado
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Publicador
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_USER_NAME: ${{ secrets.LINKEDIN_USER_NAME }}
        run: node publicar.js

      - name: Salvar Histórico no Repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historico.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: atualizar historico de postagens [skip ci]" && git push)
